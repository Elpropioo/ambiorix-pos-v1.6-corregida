
name: Ambiorix Pay - Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambiorix-pay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and compile APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find . \
            -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/node_modules/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No se encontró settings.gradle.kts."
            echo "Sube el contenido del proyecto, no solamente el ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::No se encontró app/build.gradle."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto Android: $PROJECT_DIR"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Java and Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Run unit tests
        id: tests
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::No se generó el APK."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ambiorix-artifact"
          cp "$APK" \
            "$RUNNER_TEMP/ambiorix-artifact/AmbiorixPay-debug.apk"

          ls -lh "$RUNNER_TEMP/ambiorix-artifact/AmbiorixPay-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-debug-APK
          path: ${{ runner.temp }}/ambiorix-artifact/AmbiorixPay-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest/
            **/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
